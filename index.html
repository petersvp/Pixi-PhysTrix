<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhysTrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        background: #060f20;
        font-family: Quantico, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #060f20;
      }
      body {
        min-width: 320px;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        max-width: none;
      }
      .shader-debug-panel {
        position: fixed;
        z-index: 30;
        top: 0;
        right: 0;
        bottom: 0;
        width: 320px;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        border: 0;
        border-left: 1px solid #4ac7ff;
        border-radius: 0;
        background: rgba(5, 16, 33, 0.96);
        color: #ccecff;
        font:
          12px/1.3 Quantico,
          sans-serif;
        box-shadow: -6px 0 18px rgba(47, 195, 255, 0.28);
        scrollbar-color: #4ac7ff #071426;
        user-select: none;
      }
      .shader-debug-panel h2 {
        margin: 0 0 10px;
        color: #70d4ff;
        font-size: 16px;
      }
      .shader-debug-panel h3 {
        margin: 12px 0 4px;
        color: #8fdfff;
        font-size: 13px;
        text-transform: uppercase;
      }
      .shader-debug-panel label {
        display: grid;
        grid-template-columns: 94px 1fr 38px;
        align-items: center;
        gap: 8px;
      }
      .shader-debug-panel output {
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
      .shader-debug-panel input {
        width: 100%;
        accent-color: #54cfff;
      }
      .shader-debug-panel label input[type="checkbox"] {
        width: auto;
        justify-self: start;
      }
      .curve-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 2px;
        color: #d9f4ff;
      }
      .curve-header strong {
        margin: 0;
      }
      .curve-header label {
        display: flex;
        grid-template-columns: none;
        width: auto;
        margin: 0;
        gap: 4px;
      }
      .curve-header strong {
        white-space: nowrap;
      }
      .curve-header > div {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
      }
      .curve-button-group {
        display: flex;
      }
      .shader-debug-panel .curve-header button {
        width: 22px;
        height: 22px;
        margin: 0;
        padding: 1px;
        font-size: 10px;
        border-bottom: 0;
        border-radius: 0;
      }
      .shader-debug-panel .curve-button-group button + button {
        border-left-width: 0;
      }
      .shader-debug-panel .curve-button-group button:first-child {
        border-radius: 4px 0 0 4px;
      }
      .shader-debug-panel .curve-button-group button:last-child {
        border-radius: 0 4px 4px 0;
      }
      .shader-debug-panel .curve-header button.active {
        background: #ff8b26;
        color: #15100a;
        border-color: #ffc06f;
      }
      .curve-editor {
        display: block;
        width: 100%;
        height: 72px;
        margin-top: -1px;
        background: #071426;
        touch-action: none;
      }
      .shader-debug-panel button {
        width: calc(50% - 4px);
        margin: 0 4px 4px 0;
        border: 1px solid #4ac7ff;
        border-radius: 4px;
        background: #102b49;
        color: #d8f2ff;
        padding: 5px;
      }
      .curve-editor {
        margin: 0;
      }
      .curve-editor h3 {
        display: none;
      }
      .curve-editor canvas {
        width: 100%;
        height: 56px;
        border: 1px solid #315774;
        cursor: crosshair;
      }
      .shader-feature-group {
        margin: 8px 0;
        border-top: 1px solid rgba(84, 207, 255, 0.22);
        padding-top: 5px;
      }
      .shader-feature-group > label {
        font-weight: bold;
        color: #d8f4ff;
      }
      .shader-feature-content[hidden] {
        display: none;
      }
      .shader-json-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin: 9px 0;
      }
      .shader-json-tools button {
        border: 1px solid #417da2;
        border-radius: 4px;
        padding: 5px;
        background: #102b48;
        color: #d8f4ff;
        cursor: pointer;
      }
      .shader-json-tools button:hover {
        background: #17466d;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://pixijs.download/v8.14.0/pixi.js"></script>
    <script src="https://filters.pixijs.download/main/pixi-filters.js"></script>
    <script src="./box2dweb.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
